<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4c1d95;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Container (Full Square for iOS/Android maskable compatibility) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#grad)"/>
  
  <!-- Speech Bubble with Shadow -->
  <g filter="url(#dropShadow)">
    <path d="M120 140 C120 100 150 80 190 80 L322 80 C362 80 392 100 392 140 L392 280 C392 320 362 340 322 340 L210 340 L140 410 L140 340 L120 340 C80 340 50 320 50 280 Z" fill="white" transform="translate(35, 10)"/>
  </g>
  
  <!-- Question Mark -->
  <text x="256" y="275" font-family="'Luckiest Guy', cursive, Arial" font-weight="900" font-size="160" text-anchor="middle" fill="#7c3aed" style="filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.1));">?</text>
</svg>