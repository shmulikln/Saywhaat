  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
	
<script>
    const capacitorAvailable = typeof Capacitor !== 'undefined' && Capacitor.Plugins;
    
    if (capacitorAvailable && Capacitor.Plugins.AdMob) {
        const { AdMob } = Capacitor.Plugins;
        let adShownThisRound = false;

        async function initializeAdMob() {
            try {
                await AdMob.initialize();
                console.log("AD LOG: AdMob Initialized");
                prepareAd();
            } catch (e) {
                console.error("AD LOG: Init Failed", e);
            }
        }

        async function prepareAd() {
            try {
                await AdMob.prepareInterstitial({
                    adId: 'ca-app-pub-7599308880531325/6231560290', 
                    isTesting: true 
                });
                console.log("AD LOG: Ad prepped and ready");
            } catch (e) {
                console.log("AD LOG: Prep failed", e);
            }
        }

        async function showAd() {
            try {
                await AdMob.showInterstitial();
                adShownThisRound = true;
                prepareAd();
            } catch (e) {
                console.log("AD LOG: Show failed", e);
            }
        }

        setInterval(() => {
            const currentUrl = window.location.href;
            if (currentUrl.includes('gameover')) {
                if (!adShownThisRound) {
                    console.log("AD LOG: Game Over detected! Showing Ad...");
                    showAd();
                }
            } else {
                adShownThisRound = false;
            }
        }, 2000);

        initializeAdMob();
    } else {
        console.log("AD LOG: Capacitor AdMob not available in this environment.");
    }
</script>
